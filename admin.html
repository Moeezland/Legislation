<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legislation Admin</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f7fb;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    background:#fff;
    width:420px;
    padding:30px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    color:#1d70b8;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

button{
    width:100%;
    margin-top:25px;
    padding:13px;
    background:#1d70b8;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#155a94;
}

#result{
    margin-top:20px;
    word-break:break-word;
    display:none;
    background:#eef7ff;
    border-left:4px solid #1d70b8;
    padding:15px;
}

a{
    color:#1d70b8;
}
</style>

</head>
<body>

<div class="container">

<h2>Legislation Admin</h2>

<label>Document ID</label>
<input id="docId" placeholder="JARIDA000130062026">

<label>Emiri decree</label>
<input id="decree" placeholder="E.D.0001/01/07/2026">

<label>Enforced</label>
<select id="enforced">
<option value="true">True</option>
<option value="false">False</option>
</select>

<label>Gazette</label>
<input id="gazette" placeholder="JARIDA.0001/01/07/2026">

<button id="saveBtn">Save</button>

<div id="result"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
getFirestore,
doc,
setDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCB8M1uMShs_zPZ50qHxuGYlWYJJt8n6Yw",
authDomain: "legislation-ba06a.firebaseapp.com",
projectId: "legislation-ba06a",
storageBucket: "legislation-ba06a.firebasestorage.app",
messagingSenderId: "96739996336",
appId: "1:96739996336:web:f9821273536aa7a1168175",
measurementId: "G-WQZNNSCMMN"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById("saveBtn").onclick = async ()=>{

const documentId=document.getElementById("docId").value.trim();
const decree=document.getElementById("decree").value.trim();
const enforced=document.getElementById("enforced").value==="true";
const gazette=document.getElementById("gazette").value.trim();

if(!documentId || !decree || !gazette){
alert("Please fill all fields.");
return;
}

try{

await setDoc(doc(db,"verification",documentId),{

"Emiri decree":decree,
"Enforced":enforced,
"Gazette":gazette

});

const url=`https://legislation.moeezland.com/verifier/verify.html?id=${documentId}`;

document.getElementById("result").style.display="block";
document.getElementById("result").innerHTML=`
<b>✅ Saved Successfully</b><br><br>

Verification URL:<br><br>

<a href="${url}" target="_blank">${url}</a>

<br><br>

<button onclick="navigator.clipboard.writeText('${url}')">
Copy URL
</button>
`;

}catch(err){

alert(err.message);

}

}

</script>

</body>
</html>
